@if (state.previsao.isLoading()) {
  <app-loading-spinner label="Carregando previsão..." />
} @else if (state.previsao.error()) {
  <p class="mt-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700" role="alert">
    {{ mensagemDeErro() }}
  </p>
} @else if (state.previsao.value(); as previsao) {
  <section class="mt-6">
    <h3 class="mb-3 text-sm font-semibold text-slate-600">Previsão para os próximos 5 dias</h3>
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-5">
      @for (dia of previsao.dias; track dia.data) {
        <app-forecast-card [dia]="dia" />
      }
    </div>
  </section>
}
